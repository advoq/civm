name: Restore control-plane SSH

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  restore:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/restore-control-plane-ssh'
    runs-on: [self-hosted, civm-recovery]
    timeout-minutes: 5
    env:
      CIVM_RECOVERY_AUTHORIZED_KEYS: ${{ secrets.CIVM_RECOVERY_AUTHORIZED_KEYS }}
    steps:
      - name: Restore SSH keys and Tailscale
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CIVM_RECOVERY_AUTHORIZED_KEYS:-}" ]]; then
            echo "CIVM_RECOVERY_AUTHORIZED_KEYS is empty" >&2
            exit 1
          fi

          mapfile -t keys <<< "${CIVM_RECOVERY_AUTHORIZED_KEYS}"
          install -d -m 0700 "${HOME}/.ssh"
          touch "${HOME}/.ssh/authorized_keys"
          chmod 0600 "${HOME}/.ssh/authorized_keys"

          valid_keys=0
          for key in "${keys[@]}"; do
            key="${key%$'\r'}"
            [[ -z "${key}" ]] && continue
            if [[ ! "${key}" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+([[:space:]].*)?$ ]]; then
              echo "Refusing an invalid recovery public key" >&2
              exit 1
            fi
            valid_keys=$((valid_keys + 1))
            grep -qxF -- "${key}" "${HOME}/.ssh/authorized_keys" ||
              printf '%s\n' "${key}" >> "${HOME}/.ssh/authorized_keys"
          done

          if [[ "${valid_keys}" -ne 2 ]]; then
            echo "Expected exactly 2 recovery public keys, got ${valid_keys}" >&2
            exit 1
          fi

          sudo -n systemctl restart tailscaled
          sudo -n systemctl is-active --quiet tailscaled
          tailscale status --json >/dev/null
          echo "Restored ${valid_keys} public keys; tailscaled is active"
